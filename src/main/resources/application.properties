# アプリケーション名（ログ出力・Actuator等で使用される識別名）
spring.application.name=NewBooze

# ===== MySQL/MariaDB接続設定 =====
# 開発環境はXAMPP経由のMariaDB 10.4.28(localhost:3306, phpMyAdminで管理)を想定。
# useUnicode/characterEncoding=utf8：日本語データの文字化けを防ぐための接続オプション
# serverTimezone=Asia/Tokyo：DB側と日時のタイムゾーン解釈をずらさないための指定
spring.datasource.url=jdbc:mysql://localhost:3306/newbooze?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Tokyo
# 注意：username/passwordを直書きするとGitHubへ機密情報がそのまま公開されてしまう。
# チーム内の取り決め（DB認証情報は環境変数参照にする方針）に合わせて、
# 本来は spring.datasource.username=${DB_USERNAME:root} のように
# 環境変数＋デフォルト値の形へ切り替えることを推奨（.gitignoreだけに頼らない対策）。
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA(Hibernate)設定 =====
# ddl-auto=validate：起動時にEntityの定義とDBの実テーブル定義が一致するかだけを検証し、
# テーブルの自動作成・変更は行わない。newbooze.sqlで手動管理しているDDLを
# アプリ側が勝手に書き換えてしまう事故を防ぐための設定。
# （検証時、TINYINTカラムはHibernateの既定でByte型にマッピングされる点に注意。
#   Integer型で定義すると型不一致でこのvalidateが失敗する）
spring.jpa.hibernate.ddl-auto=validate
# open-in-view=false：リクエスト処理が終わるまでDBセッションを引き延ばさない設定。
# 遅延ロード(LAZY)のフィールドをController/View側で不用意に呼び出すと例外になるため、
# Service層でのデータ取得漏れに早期に気づける（＝いわゆる「N+1問題」の温床を断つ狙い）。
spring.jpa.open-in-view=false
# MariaDBに最適化されたSQL方言を明示的に指定（MySQL方言のままだと一部構文が非互換になりうるため）
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# 開発中はテンプレートの変更を都度反映させたいため、Thymeleafのキャッシュを無効化する
# （本番運用時は逆にtrueへ戻し、パフォーマンスを優先すべき設定）
spring.thymeleaf.cache=false
# プロフィール画像は最大20MBまで受信し、5MBを超える場合はアプリ側で自動圧縮する。
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
# Spring Bootの汎用エラーページ(Whitelabel Error Page)を無効化し、
# 独自のエラーハンドリング（例：ResponseStatusExceptionによる404画面等）を優先する
server.error.whitelabel.enabled=false

# ===== 仮パスワード送信用SMTP設定 =====
# 本番環境では各値を環境変数で設定する。パスワードはファイルに直書きしない。
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
app.mail.from=${MAIL_FROM:no-reply@newbooze.local}
