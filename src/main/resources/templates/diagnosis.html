<!--
  S02: 診断画面
  外部設計書 3.3 S02：設問をsort_order順に1問ずつ表示し、
  全問回答後にdiagnosis_answersへ保存する（未ログイン時は保存せず結果表示のみ）。
  1問ずつの表示切り替え自体はJS(main.js)側の.questionクラス制御で実現している。
  ※出田担当の本番デザインに置き換え予定の暫定テンプレート。
-->
<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
  <link rel="icon" type="image/png" th:href="@{/images/site-icon.png}">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>好み診断 | 一升の出会い</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:replace="~{fragments/site-header :: siteHeader('diagnosis')}"></header>

<main class="section page diagnosis">
  <p class="eyebrow">SAKE PREFERENCE QUIZ</p>
  <h1>日本酒診断</h1>
  <p class="lead">専門知識は必要ありません。4つの質問に答えて、今のあなたに合いそうな日本酒を見つけましょう。</p>

  <form method="post" th:action="@{/diagnosis/result}" id="diagnosis-form">
    <div class="quiz-progress">
      <p id="quiz-position" role="status" aria-live="polite" aria-atomic="true" th:text="|全${#lists.size(questions)}問中 1問目|">全4問中 1問目</p>
      <progress id="quiz-progress" value="1" th:max="${#lists.size(questions)}" aria-labelledby="quiz-position"></progress>
    </div>
    <fieldset th:each="question, state : ${questions}" class="question" th:data-step="${state.index}">
      <legend tabindex="-1" th:text="|Q${state.index + 1}. ${question.text}|"></legend>
      <input type="hidden" name="choice" disabled>
      <label th:each="choice : ${question.choices}">
        <input type="radio" th:name="|question-${state.index}|" th:value="${choice.id}">
        <span th:text="${choice.text}"></span>
      </label>
    </fieldset>
    <p class="muted quiz-hint">回答を選んで「次へ」を押してください。「戻る」で回答を変更できます。</p>
    <div class="quiz-controls">
      <button class="button" type="button" id="quiz-back" disabled>← 戻る</button>
      <button class="button primary" type="submit" id="quiz-next" disabled>次へ →</button>
    </div>
    <noscript><p>診断にはJavaScriptが必要です。ブラウザの設定で有効にしてください。</p></noscript>
  </form>
</main>

<footer><strong>20歳未満の飲酒は禁止されています。</strong><span>一升の出会い — 日本酒との新しい出会い</span></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
