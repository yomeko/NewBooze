<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>好み診断 | NEWBOOZE</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header class="site-header"><a class="logo" th:href="@{/}">NEW<span>BOOZE</span></a><button class="menu-toggle" aria-label="メニューを開く">☰</button><nav><a th:href="@{/search}">さがす</a><a th:href="@{/diagnosis}">好み診断</a></nav></header><main class="section page diagnosis"><p class="eyebrow">SAKE PREFERENCE QUIZ</p><h1>好み診断</h1><p class="lead">4つの質問に答えて、今のあなたに合う地酒を見つけましょう。</p><form method="post" th:action="@{/diagnosis/result}" id="diagnosis-form"><fieldset th:each="question, state : ${questions}" class="question" th:data-step="${state.index}"><legend th:text="|Q${state.index + 1}. ${question.text}|"></legend><label th:each="choice : ${question.choices}"><input type="radio" name="choice" th:value="${choice.id}" th:required="${state.index == 0}"><span th:text="${choice.text}"></span></label></fieldset><div class="quiz-controls"><button class="button" type="button" id="previous" hidden>← 戻る</button><button class="button primary" type="button" id="next">次へ →</button><button class="button primary" type="submit" id="submit" hidden>結果を見る</button></div></form></main><footer>NEWBOOZE — 地酒との新しい出会い</footer><script th:src="@{/js/main.js}"></script></body></html>
