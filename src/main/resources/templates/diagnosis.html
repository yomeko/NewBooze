<!--
  S02: 診断画面
  外部設計書 3.3 S02：設問をsort_order順に1問ずつ表示し、
  全問回答後にdiagnosis_answersへ保存する（未ログイン時は保存せず結果表示のみ）。
  1問ずつの表示切り替え自体はJS(main.js)側の.questionクラス制御で実現している。
  ※出田担当の本番デザインに置き換え予定の暫定テンプレート。
-->
<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>好み診断 | NEWBOOZE</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="site-header">
  <a class="logo" th:href="@{/}">NEW<span>BOOZE</span></a>
  <button class="menu-toggle" aria-label="メニューを開く">☰</button>
  <nav>
    <a th:href="@{/search}">さがす</a>
    <a th:href="@{/diagnosis}">好み診断</a>
    <a sec:authorize="isAnonymous()" th:href="@{/login}">ログイン</a>
    <a sec:authorize="isAnonymous()" class="button" th:href="@{/signup}">新規登録</a>
    <a sec:authorize="isAuthenticated()" th:href="@{/mypage}">マイページ</a>
    <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="nav-logout-form">
      <button type="submit" class="link-button">ログアウト</button>
    </form>
  </nav>
</header>

<main class="section page diagnosis">
  <p class="eyebrow">SAKE PREFERENCE QUIZ</p>
  <h1>好み診断</h1>
  <p class="lead">4つの質問に答えて、今のあなたに合う地酒を見つけましょう。</p>

  <!--
    DiagnosisController.result()（POST /diagnosis/result）へ回答を送信するフォーム。
    各設問は name="choice" のラジオボタンで、複数の設問分がまとめて
    List<Long> choices として受け取られる（同名name属性の値は配列的に集約される）。

    th:each="question, state : ${questions}" の state はイテレーション状態変数で、
    state.index により「Q1.」「Q2.」…という設問番号や、
    fieldsetのdata-step属性（JS側で使用可能な情報として）を出し分けている。
  -->
  <form method="post" th:action="@{/diagnosis/result}" id="diagnosis-form">
    <fieldset th:each="question, state : ${questions}" class="question" th:data-step="${state.index}">
      <legend th:text="|Q${state.index + 1}. ${question.text}|"></legend>
      <label th:each="choice : ${question.choices}">
        <!--
          th:required="${state.index == 0}"：
          最初の設問(1問目)にだけHTML標準のrequired属性を付けている。
          2問目以降は表示自体がJSで制御されるため、ブラウザの標準バリデーションに頼らず、
          main.js側の「未選択なら次へ進ませない」チェックで代用している。
        -->
        <input type="radio" name="choice" th:value="${choice.id}" th:required="${state.index == 0}">
        <span th:text="${choice.text}"></span>
      </label>
    </fieldset>

    <!-- ウィザードの操作ボタン。表示/非表示はmain.jsのrender()が制御する -->
    <div class="quiz-controls">
      <button class="button" type="button" id="previous" hidden>← 戻る</button>
      <button class="button primary" type="button" id="next">次へ →</button>
      <button class="button primary" type="submit" id="submit" hidden>結果を見る</button>
    </div>
  </form>
</main>

<footer>NEWBOOZE — 地酒との新しい出会い</footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
