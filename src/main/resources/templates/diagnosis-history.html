<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>診断履歴 | 一升の出会い</title>
  <link rel="icon" type="image/png" th:href="@{/images/site-icon.png}">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/site-header :: siteHeader('mypage')}"></header>
<main class="section page">
  <p class="eyebrow">DIAGNOSIS HISTORY</p>
  <h1>診断履歴</h1>
  <p class="lead">ログインして受けた診断を、新しい順に確認できます。日時を選ぶと、その回に選んだ回答が開きます。</p>
  <p><a class="button" th:href="@{/mypage#taste}">マイページに戻る</a>
    <a class="button primary" th:href="@{/diagnosis}">好みを診断する</a></p>
  <p class="empty" th:if="${history.isEmpty()}">まだ診断履歴がありません。</p>
  <!-- 保存済みの回答をそのまま表示し、現在のタグやカタログで過去の結果を計算し直さない。 -->
  <section class="mypage-card" th:unless="${history.isEmpty()}" aria-labelledby="saved-answers">
    <h2 id="saved-answers">保存された回答</h2>
    <details class="answer-summary" th:each="entry : ${history.content}">
      <summary><time th:datetime="${entry.takenAt}"
                     th:text="${#temporals.format(entry.takenAt, 'yyyy/MM/dd HH:mm:ss')}"></time>
        <span th:text="|${#lists.size(entry.answers)}件の回答|"></span></summary>
      <ol th:unless="${#lists.isEmpty(entry.answers)}">
        <li th:each="answer : ${entry.answers}">
          <p th:text="${answer.question}"></p>
          <strong th:text="${answer.choice}"></strong>
        </li>
      </ol>
      <p class="muted" th:if="${#lists.isEmpty(entry.answers)}">この回の回答は保存されていません。</p>
    </details>
  </section>
  <nav class="pagination" aria-label="診断履歴のページ" th:if="${history.hasPrevious() or history.hasNext()}">
    <a th:if="${history.hasPrevious()}" th:href="@{/mypage/diagnosis-history(page=${history.number - 1})}">前へ</a>
    <span th:text="|${history.number + 1}ページ目|"></span>
    <a th:if="${history.hasNext()}" th:href="@{/mypage/diagnosis-history(page=${history.number + 1})}">次へ</a>
  </nav>
</main>
<footer><strong>20歳未満の飲酒は禁止されています。</strong><span>一升の出会い — 日本酒との新しい出会い</span></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
