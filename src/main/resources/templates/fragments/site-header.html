<!--
  全画面で使う共通ヘッダーの部品。各画面のth:replaceがsiteHeaderを読み込む。
  currentPageは表示中のページ名で、メニューの強調に使う。
  th:...はJavaから渡された値をHTMLへ反映し、sec:authorizeはログイン状態や権限で表示を切り替える。
-->
<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<body>
<header class="site-header" th:fragment="siteHeader(currentPage)">
  <div class="header-main">
    <a class="logo" th:href="@{/}" aria-label="一升の出会い ホーム">
      <img class="logo-mark" th:src="@{/images/icon2.png}" src="/images/site-icon.png" alt="" width="48" height="48">
      <span class="logo-name">一升<span>の出会い</span></span>
    </a>

    <!-- ヘッダーの検索はGET /searchへkeywordを渡す。各画面で同じ検索入口を使える。 -->
    <form class="header-search" role="search" th:action="@{/search}" method="get">
      <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
      <label class="visually-hidden" for="header-keyword">日本酒を検索</label>
      <input id="header-keyword" name="keyword" type="search" placeholder="銘柄・酒蔵・地域から探す">
      <button type="submit" aria-label="検索する">検索</button>
    </form>

    <!-- 未ログイン・ログイン中・管理者で表示する操作を切り替える。ログアウトはPOSTで送信する。 -->
    <div class="header-actions">
      <a class="header-login" sec:authorize="isAnonymous()" th:href="@{/login}">ログイン</a>
      <a class="header-signup" sec:authorize="isAnonymous()" th:href="@{/signup}">新規登録</a>
      <a class="header-login" sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">管理画面</a>
      <a class="header-login" sec:authorize="isAuthenticated()" th:href="@{/mypage}" th:attr="aria-current=${currentPage == 'mypage'} ? 'page' : null">マイページ</a>
      <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="nav-logout-form">
        <button type="submit" class="header-signup">ログアウト</button>
      </form>
      <button class="menu-toggle" type="button" aria-label="その他のメニューを開く" aria-controls="site-menu" aria-expanded="false" aria-haspopup="dialog"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"></path></svg><span class="menu-label">その他</span></button>
    </div>
  </div>

  <!-- 狭い画面ではメニューを横スクロールする。main.jsが端の矢印の表示と有効・無効を制御する。 -->
  <div class="nav-overflow">
  <button class="nav-scroll-button nav-previous" type="button" aria-label="前のナビ項目を表示" aria-controls="main-navigation" hidden>‹</button>
  <nav id="main-navigation" class="main-nav" aria-label="主なページ">
    <a th:href="@{/}" th:attr="aria-current=${currentPage == 'home'} ? 'page' : null">TOP</a>
    <a th:href="@{/search}" th:attr="aria-current=${currentPage == 'search'} ? 'page' : null">日本酒をさがす</a>
    <a th:href="@{/diagnosis}" th:attr="aria-current=${currentPage == 'diagnosis'} ? 'page' : null">日本酒診断</a>
    <a th:href="@{/guide}" th:attr="aria-current=${currentPage == 'guide'} ? 'page' : null">初心者ガイド</a>
    <a th:href="@{/ranking}" th:attr="aria-current=${currentPage == 'ranking'} ? 'page' : null">ランキング</a>
    <a th:href="@{/pairings}" th:attr="aria-current=${currentPage == 'pairings'} ? 'page' : null">おつまみ・酒器</a>
    <a th:href="@{/goods}" th:attr="aria-current=${currentPage == 'goods'} ? 'page' : null">関連商品</a>
  </nav>
  <button class="nav-scroll-button nav-next" type="button" aria-label="次のナビ項目を表示" aria-controls="main-navigation" hidden>›</button>
  </div>
  <p class="nav-scroll-hint" hidden>横にスワイプして、ほかのページも見られます</p>
  <!-- 「その他」のボタンで開く標準dialog。main.jsが開閉し、閉じたら開いたボタンへフォーカスを戻す。 -->
  <dialog id="site-menu" class="site-menu" aria-labelledby="site-menu-title">
    <div class="site-menu-panel">
      <div class="site-menu-heading">
        <h2 id="site-menu-title">その他のメニュー</h2>
        <button class="site-menu-close" type="button" aria-label="メニューを閉じる" autofocus>×</button>
      </div>
      <div class="mobile-account-actions">
        <a sec:authorize="isAnonymous()" th:href="@{/login}">ログイン</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">管理画面</a>
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post"><button type="submit" class="button">ログアウト</button></form>
      </div>
      <nav class="site-menu-links" aria-label="サイトメニュー">
        <a th:href="@{/guide}"><span>購入から開封後までの初心者ガイド</span><span aria-hidden="true">›</span></a>
        <a th:href="@{/brewery-map}"><span>酒蔵のマップ</span><span aria-hidden="true">›</span></a>
        <a th:href="@{/contact}"><span>お問い合わせ</span><span aria-hidden="true">›</span></a>
        <a th:href="@{/categories}"><span>カテゴリ</span><span aria-hidden="true">›</span></a>
        <a th:href="@{/tags}"><span>おすすめのタグ</span><span aria-hidden="true">›</span></a>
        <a class="site-menu-divider" th:href="@{/about}"><span>運営者情報</span><span aria-hidden="true">›</span></a>
        <a th:href="@{/privacy}"><span>プライバシーポリシー</span><span aria-hidden="true">›</span></a>
        <a th:href="@{/external-transmission}"><span>利用者情報の送信について</span><span aria-hidden="true">›</span></a>
      </nav>
    </div>
  </dialog>
</header>
</body>
</html>
