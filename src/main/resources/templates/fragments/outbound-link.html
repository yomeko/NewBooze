<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- CSRF付きの同一サイトへのPOSTだけを記録し、公式サイトへは303で移動する。 -->
<form th:fragment="outboundLink(source, target, kind, label, buttonClass)"
      class="outbound-form" th:action="@{/sake/outbound}" method="post"
      target="_blank" rel="noopener noreferrer">
  <input type="hidden" name="source" th:value="${source}">
  <input type="hidden" name="target" th:value="${target}">
  <input type="hidden" name="kind" th:value="${kind}">
  <button type="submit" class="outbound-link" th:classappend="${buttonClass}"><span th:text="${label}"></span><span class="visually-hidden">（公式サイトを新しいタブで開く）</span></button>
</form>
</body>
</html>
