<!--
  ホーム・検索・診断結果で使う銘柄比較カードの共通部品。
  comparison(sake)に渡された銘柄の写真と、香り・甘さ・飲み口の5段階表示を描く。
-->
<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="comparison(sake)" class="sake-comparison">
  <!-- 画像がなければ案内を表示する。画像URLがあって読み込みに失敗した場合もmain.jsが案内へ切り替える。 -->
  <div class="sake-card-image">
    <img th:if="${!#strings.isEmpty(sake.imageUrl)}" th:src="${sake.imageUrl}" th:alt="|${sake.name}の瓶・ラベル|" loading="lazy" width="240" height="180">
    <span class="sake-image-fallback" th:hidden="${!#strings.isEmpty(sake.imageUrl)}"><span aria-hidden="true">◇</span>商品写真準備中</span>
  </div>
  <!-- JavaのtasteIndicators()で作る3項目を表示する。強さがnullなら数値とmeterを表示しない。 -->
  <dl class="taste-indicators">
    <div th:each="indicator : ${sake.tasteIndicators()}">
      <dt th:text="${indicator.label}"></dt>
      <dd><span th:text="${indicator.description}"></span><span class="taste-level" th:if="${indicator.level != null}" th:text="|${indicator.level}/5|"></span>
        <meter th:if="${indicator.level != null}" min="0" max="5" th:value="${indicator.level}" th:attr="aria-label=|${indicator.label}：${indicator.description}の強さ|"></meter>
      </dd>
    </div>
  </dl>
  <p class="taste-note">登録タグの強さ（5段階）</p>
</div>
</body>
</html>
