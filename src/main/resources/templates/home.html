<!--
  S01: トップ画面
  外部設計書 3.3 S01：注目銘柄のマーキー表示、検索・診断への導線を提供する。
  ※出田担当の本番デザインに置き換え予定の暫定テンプレート。
-->
<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NEWBOOZE | 地酒サーチ</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- 全画面共通ヘッダー：ロゴ＋ハンバーガーメニュー＋ナビゲーション -->
<header class="site-header">
  <a class="logo" th:href="@{/}">NEW<span>BOOZE</span></a>
  <button class="menu-toggle" aria-label="メニューを開く">☰</button>
  <nav>
    <a th:href="@{/search}">さがす</a>
    <a th:href="@{/diagnosis}">好み診断</a>
  </nav>
</header>

<main>
  <!-- ヒーローセクション：キャッチコピーと「診断する」「検索する」への導線ボタン -->
  <section class="hero">
    <p class="eyebrow">JAPANESE SAKE DISCOVERY</p>
    <h1>今の気分に、<br><em>一杯の地酒</em>を。</h1>
    <p>味わいから探して、好みから出会う。<br>あなたのための地酒サーチ。</p>
    <div class="actions">
      <a class="button primary" th:href="@{/diagnosis}">好みを診断する</a>
      <a class="button" th:href="@{/search}">地酒をさがす</a>
    </div>
  </section>

  <!--
    マーキー（注目銘柄の横スクロール表示）
    非推奨の<marquee>タグは使わず、featured一覧を「2回連続で」出力することで、
    CSS側の@keyframes scroll（-50%だけ左へ移動）と組み合わせ、
    継ぎ目のないシームレスループを実現している（内部設計書 4.1参照）。
    2つ目のth:eachにはaria-hidden="true"を付け、
    スクリーンリーダーには複製分を読み上げさせないようにしている。
  -->
  <section class="marquee" aria-label="注目銘柄">
    <div class="marquee-track">
      <span th:each="sake : ${featured}" th:text="|✦ ${sake.name}　　|"></span>
      <span th:each="sake : ${featured}" aria-hidden="true" th:text="|✦ ${sake.name}　　|"></span>
    </div>
  </section>

  <!-- 注目の地酒カード一覧（HomeControllerがSakeCatalogService.featured()で渡した先頭5件） -->
  <section class="section">
    <div class="section-heading">
      <p class="eyebrow">FEATURED SAKE</p>
      <h2>注目の地酒</h2>
    </div>
    <div class="card-grid">
      <article class="sake-card" th:each="sake : ${featured}">
        <p class="badge" th:text="${sake.type}"></p>
        <h3 th:text="${sake.name}"></h3>
        <p class="muted" th:text="${sake.region}"></p>
        <p th:text="${sake.description}"></p>
        <!-- th:href の (id=${sake.id}) 記法：URLの{id}プレースホルダーに値を埋め込む -->
        <a th:href="@{/sake/{id}(id=${sake.id})}">詳しく見る →</a>
      </article>
    </div>
  </section>
</main>

<footer>NEWBOOZE — 地酒との新しい出会い</footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
