<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理画面 - 一升の出会い</title><link rel="stylesheet" th:href="@{/css/style.css}">
<style>.admin-page{max-width:960px;margin:40px auto;padding:24px}.admin-page nav{display:flex;gap:24px;margin-bottom:28px}.admin-page table{width:100%;border-collapse:collapse}.admin-page td,.admin-page th{padding:12px;text-align:left;border-bottom:1px solid #ddd}.admin-page .form-group{margin-bottom:20px}.admin-page input,.admin-page select,.admin-page textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:6px}.admin-page .error{color:#b3261e}.admin-page .success{color:#23734b}</style>
</head><body><header th:replace="~{fragments/site-header :: siteHeader('admin')}"></header>
<main class="admin-page"><h1>管理画面</h1><nav><a th:href="@{/admin}">管理トップ</a><a th:href="@{/admin/sake/new}">日本酒を登録</a><a th:href="@{/admin/users}">ユーザー一覧・検索</a></nav>
<h2>ユーザー一覧・検索</h2><form th:action="@{/admin/users}" method="get"><div class="form-group"><label for="keyword">ユーザー名</label><input id="keyword" name="keyword" th:value="${keyword}" placeholder="ユーザー名で検索" type="search"></div><button class="button primary">検索</button> <a th:href="@{/admin/users}">すべて表示</a></form>
<p th:text="|${users.totalElements} 件|"></p><table><thead><tr><th>ID</th><th>ユーザー名</th><th>権限</th></tr></thead><tbody><tr th:each="user : ${users}"><td th:text="${user.id}"></td><td th:text="${user.name}"></td><td th:text="${user.admin ? '管理者' : '一般ユーザー'}"></td></tr></tbody></table><p th:if="${users.empty}">該当するユーザーがいません。</p>
<nav><a th:if="${users.hasPrevious()}" th:href="@{/admin/users(keyword=${keyword},page=${users.number - 1})}">前へ</a><a th:if="${users.hasNext()}" th:href="@{/admin/users(keyword=${keyword},page=${users.number + 1})}">次へ</a></nav></main><script th:src="@{/js/main.js}"></script></body></html>
