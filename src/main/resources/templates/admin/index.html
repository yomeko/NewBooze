<!--
  管理者向けの入口。日本酒の登録画面とユーザーの検索画面へのリンクを表示する。
  アクセスできるのはSecurityConfigでROLE_ADMINの権限を確認できたユーザーだけ。
-->
<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理画面 - 一升の出会い</title><link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet" th:href="@{/css/admin.css}">
</head><body><header th:replace="~{fragments/site-header :: siteHeader('admin')}"></header>
<!-- 管理者が行う操作への入口を並べる。共通ヘッダー以外の管理画面の見た目はadmin.cssで指定する。 -->
<main class="admin-page"><h1>管理画面</h1><nav class="admin-nav" aria-label="管理メニュー"><a th:href="@{/admin}" aria-current="page">管理トップ</a><a th:href="@{/admin/sake/new}">日本酒を登録</a><a th:href="@{/admin/users}">ユーザー一覧・検索</a></nav>
<h2>管理者メニュー</h2><p>新しい日本酒の登録と、ユーザー名の一覧・検索ができます。</p></main><script th:src="@{/js/main.js}"></script></body></html>
