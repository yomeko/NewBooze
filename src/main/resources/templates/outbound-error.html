<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>公式サイトを開けませんでした | 一升の出会い</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/site-header :: siteHeader('search')}"></header>
<main class="beginner-guide">
  <h1>公式サイトを開けませんでした</h1>
  <p role="alert">クリックを記録できませんでした。時間をおいて、もう一度お試しください。</p>
  <form th:action="@{/sake/outbound}" method="post">
    <input type="hidden" name="source" th:value="${source}">
    <input type="hidden" name="target" th:value="${target}">
    <input type="hidden" name="kind" th:value="${kind}">
    <button type="submit" class="button primary">もう一度開く</button>
  </form>
  <p><a th:href="@{${backUrl}}">元のページへ戻る</a></p>
</main>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
