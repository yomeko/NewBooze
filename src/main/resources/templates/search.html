<!--
  S04: 検索結果一覧画面
  外部設計書 4.4：キーワード・酒種・地域による絞り込み＋ページネーション表示。
  ※出田担当の本番デザインに置き換え予定の暫定テンプレート。
-->
<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>日本酒をさがす | NEWBOOZE</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="site-header">
  <a class="logo" th:href="@{/}">NEW<span>BOOZE</span></a>
  <button class="menu-toggle" aria-label="メニューを開く">☰</button>
  <nav>
    <a th:href="@{/search}">日本酒をさがす</a>
    <a th:href="@{/diagnosis}">日本酒診断</a>
    <a sec:authorize="isAnonymous()" th:href="@{/login}">ログイン</a>
    <a sec:authorize="isAnonymous()" class="button" th:href="@{/signup}">新規登録</a>
    <a sec:authorize="isAuthenticated()" th:href="@{/mypage}">マイページ</a>
    <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="nav-logout-form">
      <button type="submit" class="link-button">ログアウト</button>
    </form>
  </nav>
</header>

<main class="section page">
  <p class="eyebrow">SAKE SEARCH</p>
  <h1>日本酒をさがす</h1>
  <p class="lead">商品名や地域、味わいの特徴から、気になる日本酒を探せます。</p>

  <!--
    検索フォーム：method="get" のため、送信内容はクエリパラメータとして
    /search?keyword=...&type=...&region=...&page=... の形でURLに現れる
    （SakeSearchController.search()の@RequestParamで受け取る）。
    プルダウンの選択肢はControllerがtypes()/regions()で渡した一覧を元に
    th:eachで動的に生成し、th:selectedで現在の選択状態を復元している。
  -->
  <form class="search-form" method="get" th:action="@{/search}">
    <input name="keyword" th:value="${keyword}" placeholder="銘柄名・地域・特徴で検索">
    <select name="type">
      <option value="">すべての酒種</option>
      <option th:each="value : ${types}" th:value="${value}"
              th:selected="${value == selectedType}" th:text="${value}"></option>
    </select>
    <select name="region">
      <option value="">すべての地域</option>
      <option th:each="value : ${regions}" th:value="${value}"
              th:selected="${value == selectedRegion}" th:text="${value}"></option>
    </select>
    <button class="button primary">検索</button>
  </form>

  <!-- 検索結果件数の表示 -->
  <p class="result-count"><strong th:text="${result.totalElements}">0</strong> 件の日本酒</p>

  <!-- 検索結果一覧（SakePageDto.content分のみ表示。1ページ分はService側でスライス済み） -->
  <div class="card-grid">
    <article class="sake-card" th:each="sake : ${result.content}">
      <p class="badge" th:text="${sake.type}"></p>
      <h2 th:text="${sake.name}"></h2>
      <!-- リテラル置換構文(|...|)の中に、numbers.formatIntegerでカンマ区切りの価格表示を組み込む -->
      <p class="muted" th:text="|${sake.region} ・ ${sake.abv}% ・ ${#numbers.formatInteger(sake.price, 1, 'COMMA')}円|"></p>
      <p th:text="${sake.description}"></p>
      <a th:href="@{/sake/{id}(id=${sake.id})}">詳しく見る →</a>
    </article>
  </div>

  <!-- 該当0件の場合のメッセージ表示 -->
  <p th:if="${result.totalElements == 0}" class="empty">条件に合う日本酒が見つかりませんでした。</p>

  <!--
    ページネーション。
    現在の検索条件(keyword/type/region)を維持したまま、pageだけを変えたリンクを組み立てる。
    result.totalPagesが1以下（＝ページ分割不要）の場合は表示自体をスキップする。
  -->
  <nav class="pagination" th:if="${result.totalPages > 1}">
    <a th:if="${result.hasPrevious}"
       th:href="@{/search(keyword=${keyword},type=${selectedType},region=${selectedRegion},page=${result.pageNumber - 1})}">← 前へ</a>

    <!-- #numbers.sequence(0, N-1) で 0〜(総ページ数-1) の連番を生成し、ページ番号リンクを並べる -->
    <span th:each="number : ${#numbers.sequence(0, result.totalPages - 1)}">
      <a th:classappend="${number == result.pageNumber} ? ' current'"
         th:href="@{/search(keyword=${keyword},type=${selectedType},region=${selectedRegion},page=${number})}"
         th:text="${number + 1}"></a>
    </span>

    <a th:if="${result.hasNext}"
       th:href="@{/search(keyword=${keyword},type=${selectedType},region=${selectedRegion},page=${result.pageNumber + 1})}">次へ →</a>
  </nav>
</main>

<footer><strong>20歳未満の飲酒は禁止されています。</strong><span>NEWBOOZE — 日本酒との新しい出会い</span></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
