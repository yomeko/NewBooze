<!--
  S04: 検索結果一覧画面
  外部設計書 4.4：味・酒種・価格帯による絞り込みと並び替え＋ページネーション表示。
  ※出田担当の本番デザインに置き換え予定の暫定テンプレート。
-->
<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
  <link rel="icon" type="image/png" th:href="@{/images/site-icon.png}">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>日本酒をさがす | 一升の出会い</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:replace="~{fragments/site-header :: siteHeader('search')}"></header>

<main class="section page">
  <p class="eyebrow">SAKE SEARCH</p>
  <h1>日本酒をさがす</h1>
  <p class="lead">銘柄名や味の特徴・風味から、気になる日本酒を探せます。</p>

  <!--
    検索フォーム：method="get" のため、送信内容はクエリパラメータとして
    /search?name=...&keyword=...&type=...&taste=...&priceRange=...&sort=...&page=... の形でURLに現れる
    （SakeSearchController.search()の@RequestParamで受け取る）。
  -->
  <form class="search-form" method="get" th:action="@{/search}">
    <div class="search-field">
      <label for="search-name">銘柄名</label>
      <input id="search-name" name="name" type="search" th:value="${name}"
             placeholder="銘柄名の一部を入力">
    </div>
    <div class="search-field">
      <label for="search-keyword">味の特徴・風味</label>
      <!-- 半角・全角の#付き入力と、タグ名だけの入力が使えることを例示する。 -->
      <input id="search-keyword" name="keyword" th:value="${keyword}"
             placeholder="例：#辛口、＃甘口、フルーティー">
    </div>
    <div class="search-field">
      <label for="search-taste">辛口・甘口</label>
      <select id="search-taste" name="taste">
        <option value="">すべて</option>
        <option value="辛口" th:selected="${selectedTaste == '辛口'}">辛口</option>
        <option value="甘口" th:selected="${selectedTaste == '甘口'}">甘口</option>
      </select>
    </div>
    <div class="search-field">
      <label for="search-type">酒の種類</label>
      <select id="search-type" name="type">
        <option value="">すべての種類</option>
        <option th:each="value : ${types}" th:value="${value}"
                th:selected="${value == selectedType}" th:text="${value}"></option>
      </select>
    </div>
    <div class="search-field">
      <label for="search-price">価格帯（公式サイトの販売値）</label>
      <select id="search-price" name="priceRange">
        <option value="">すべての価格</option>
        <option value="under-1500" th:selected="${selectedPriceRange == 'under-1500'}">1,500円未満</option>
        <option value="1500-2999" th:selected="${selectedPriceRange == '1500-2999'}">1,500～2,999円</option>
        <option value="3000-4999" th:selected="${selectedPriceRange == '3000-4999'}">3,000～4,999円</option>
        <option value="5000-up" th:selected="${selectedPriceRange == '5000-up'}">5,000円以上</option>
      </select>
    </div>
    <div class="search-field">
      <label for="search-sort">並び順</label>
      <select id="search-sort" name="sort">
        <option value="recommended" th:selected="${selectedSort == 'recommended'}">おすすめ</option>
        <option value="ratingDesc" th:selected="${selectedSort == 'ratingDesc'}">平均評価が高い順</option>
        <option value="ratingAsc" th:selected="${selectedSort == 'ratingAsc'}">平均評価が低い順</option>
        <option value="reviewCount" th:selected="${selectedSort == 'reviewCount'}">評価件数が多い順</option>
        <option value="priceAsc" th:selected="${selectedSort == 'priceAsc'}">安い順</option>
        <option value="priceDesc" th:selected="${selectedSort == 'priceDesc'}">高い順</option>
        <option value="newest" th:selected="${selectedSort == 'newest'}">新着順</option>
      </select>
    </div>
    <button class="button primary">検索</button>
  </form>

  <!-- 検索結果件数の表示 -->
  <p class="result-count" id="search-results"><strong th:text="${result.totalElements}">0</strong> 件の日本酒</p>

  <!-- 検索結果一覧（SakePageDto.content分のみ表示。1ページ分はService側でスライス済み） -->
  <div class="card-grid">
    <article class="sake-card" th:each="sake : ${result.content}">
      <p class="badge" th:text="${sake.type}"></p>
      <h2 th:text="${sake.name}"></h2>
      <p th:if="${sake.reviewCount > 0}" th:text="|★ ${#numbers.formatDecimal(sake.averageRating, 1, 1)} / 5（${sake.reviewCount}件）|"></p>
      <p class="muted" th:unless="${sake.reviewCount > 0}">まだ評価がありません</p>
      <p class="muted" th:if="${!#strings.isEmpty(sake.breweryName)}" th:text="|蔵元：${sake.breweryName}|"></p>
      <!-- リテラル置換構文(|...|)の中に、numbers.formatIntegerでカンマ区切りの価格表示を組み込む -->
      <p class="muted" th:text="|${sake.region} ・ ${sake.abv}% ・ ${#numbers.formatInteger(sake.price, 1, 'COMMA')}円|"></p>
      <p th:text="${sake.description}"></p>
      <a th:href="@{/sake/{id}(id=${sake.id})}">詳しく見る →</a>
    </article>
  </div>

  <!-- 該当0件の場合のメッセージ表示 -->
  <p th:if="${result.totalElements == 0}" class="empty">条件に合う日本酒が見つかりませんでした。</p>

  <!--
    ページネーション。
    現在の検索条件を維持したまま、pageだけを変えたリンクを組み立てる。
    result.totalPagesが1以下（＝ページ分割不要）の場合は表示自体をスキップする。
  -->
  <nav class="pagination" th:if="${result.totalPages > 1}">
    <a th:if="${result.hasPrevious}"
       th:href="@{/search(name=${name},keyword=${keyword},type=${selectedType},taste=${selectedTaste},priceRange=${selectedPriceRange},sort=${selectedSort},page=${result.pageNumber - 1})}">← 前へ</a>

    <!-- #numbers.sequence(0, N-1) で 0〜(総ページ数-1) の連番を生成し、ページ番号リンクを並べる -->
    <span th:each="number : ${#numbers.sequence(0, result.totalPages - 1)}">
      <a th:classappend="${number == result.pageNumber} ? ' current'"
         th:href="@{/search(name=${name},keyword=${keyword},type=${selectedType},taste=${selectedTaste},priceRange=${selectedPriceRange},sort=${selectedSort},page=${number})}"
         th:text="${number + 1}"></a>
    </span>

    <a th:if="${result.hasNext}"
       th:href="@{/search(name=${name},keyword=${keyword},type=${selectedType},taste=${selectedTaste},priceRange=${selectedPriceRange},sort=${selectedSort},page=${result.pageNumber + 1})}">次へ →</a>
  </nav>
</main>

<footer><strong>20歳未満の飲酒は禁止されています。</strong><span>一升の出会い — 日本酒との新しい出会い</span></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
