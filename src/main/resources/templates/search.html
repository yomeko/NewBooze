<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地酒をさがす | NEWBOOZE</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header class="site-header"><a class="logo" th:href="@{/}">NEW<span>BOOZE</span></a><button class="menu-toggle" aria-label="メニューを開く">☰</button><nav><a th:href="@{/search}">さがす</a><a th:href="@{/diagnosis}">好み診断</a></nav></header><main class="section page">
<p class="eyebrow">SAKE SEARCH</p><h1>地酒をさがす</h1><form class="search-form" method="get" th:action="@{/search}"><input name="keyword" th:value="${keyword}" placeholder="銘柄名・地域・特徴で検索"><select name="type"><option value="">すべての酒種</option><option th:each="value : ${types}" th:value="${value}" th:selected="${value == selectedType}" th:text="${value}"></option></select><select name="region"><option value="">すべての地域</option><option th:each="value : ${regions}" th:value="${value}" th:selected="${value == selectedRegion}" th:text="${value}"></option></select><button class="button primary">検索</button></form>
<p class="result-count"><strong th:text="${result.totalElements}">0</strong> 件の地酒</p><div class="card-grid"><article class="sake-card" th:each="sake : ${result.content}"><p class="badge" th:text="${sake.type}"></p><h2 th:text="${sake.name}"></h2><p class="muted" th:text="|${sake.region} ・ ${sake.abv}% ・ ${#numbers.formatInteger(sake.price, 1, 'COMMA')}円|"></p><p th:text="${sake.description}"></p><a th:href="@{/sake/{id}(id=${sake.id})}">詳しく見る →</a></article></div><p th:if="${result.totalElements == 0}" class="empty">条件に合う地酒が見つかりませんでした。</p>
<nav class="pagination" th:if="${result.totalPages > 1}"><a th:if="${result.hasPrevious}" th:href="@{/search(keyword=${keyword},type=${selectedType},region=${selectedRegion},page=${result.pageNumber - 1})}">← 前へ</a><span th:each="number : ${#numbers.sequence(0, result.totalPages - 1)}"><a th:classappend="${number == result.pageNumber} ? ' current'" th:href="@{/search(keyword=${keyword},type=${selectedType},region=${selectedRegion},page=${number})}" th:text="${number + 1}"></a></span><a th:if="${result.hasNext}" th:href="@{/search(keyword=${keyword},type=${selectedType},region=${selectedRegion},page=${result.pageNumber + 1})}">次へ →</a></nav></main><footer>NEWBOOZE — 地酒との新しい出会い</footer><script th:src="@{/js/main.js}"></script></body></html>
