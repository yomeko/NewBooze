<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DM - NEWBOOZE</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<header class="site-header"><a class="logo" th:href="@{/}">NEW<span>BOOZE</span></a><button class="menu-toggle" aria-label="メニューを開く">☰</button><nav><a th:href="@{/search}">さがす</a><a th:href="@{/diagnosis}">好み診断</a><a th:href="@{/mypage}">マイページ</a><form th:action="@{/logout}" method="post" class="nav-logout-form"><button type="submit" class="link-button">ログアウト</button></form></nav></header>
<main class="page message-page"><section class="message-card"><div class="message-head"><div class="mini-avatar" th:text="${#strings.substring(other.name,0,1)}"></div><div><p class="eyebrow">DIRECT MESSAGE</p><h1 th:text="${other.name}"></h1></div></div><p class="auth-alert" th:if="${error}" th:text="${error}"></p>
<div class="message-stream"><p class="muted message-empty" th:if="${#lists.isEmpty(messages)}">最初のメッセージを送ってみましょう。</p><article th:each="message : ${messages}" th:classappend="${message.sender.id == me.id} ? ' mine' : ''"><b th:text="${message.sender.id == me.id ? 'あなた' : message.sender.name}"></b><p th:text="${message.body}"></p><time th:text="${#temporals.format(message.createdAt,'MM/dd HH:mm')}"></time></article></div>
<form class="message-form" th:action="@{/mypage/messages/{id}(id=${other.id})}" method="post"><textarea name="body" maxlength="1000" required placeholder="メッセージを入力"></textarea><button class="button primary">送信</button></form></section></main><footer>NEWBOOZE — 地酒との新しい出会い</footer><script th:src="@{/js/main.js}"></script></body></html>
