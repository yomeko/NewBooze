<!--
  S05: 地酒詳細画面
  外部設計書 3.3 S05：名称・酒種・産地・度数・価格・説明文・画像を表示し、
  詳細情報はDisclosure Triangle（<details>/<summary>）で開閉表示する。
  ※出田担当の本番デザインに置き換え予定の暫定テンプレート。
-->
<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- タイトルを銘柄名込みで動的に生成 -->
  <title th:text="|${sake.name} | NEWBOOZE|"></title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="site-header">
  <a class="logo" th:href="@{/}">NEW<span>BOOZE</span></a>
  <button class="menu-toggle" aria-label="メニューを開く">☰</button>
  <nav>
    <a th:href="@{/search}">日本酒をさがす</a>
    <a th:href="@{/diagnosis}">日本酒診断</a>
    <a sec:authorize="isAnonymous()" th:href="@{/login}">ログイン</a>
    <a sec:authorize="isAnonymous()" class="button" th:href="@{/signup}">新規登録</a>
    <a sec:authorize="isAuthenticated()" th:href="@{/mypage}">マイページ</a>
    <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="nav-logout-form">
      <button type="submit" class="link-button">ログアウト</button>
    </form>
  </nav>
</header>

<main class="section page detail">
  <a class="back" th:href="@{/search}">← 検索結果へ戻る</a>

  <p class="badge" th:text="${sake.type}"></p>
  <h1 th:text="${sake.name}"></h1>
  <p class="lead" th:text="${sake.description}"></p>

  <!-- 常時表示するスペック情報（外部設計書 7.2「常時表示項目」） -->
  <dl class="spec">
    <div th:if="${!#strings.isEmpty(sake.breweryName)}"><dt>蔵元</dt><dd th:text="${sake.breweryName}"></dd></div>
    <div th:if="${!#strings.isEmpty(sake.breweryPrefecture)}"><dt>蔵元所在地</dt><dd th:text="${sake.breweryPrefecture}"></dd></div>
    <div><dt>産地</dt><dd th:text="${sake.region}"></dd></div>
    <div><dt>アルコール度数</dt><dd th:text="|${sake.abv}%|"></dd></div>
    <div><dt>参考価格</dt><dd th:text="|${#numbers.formatInteger(sake.price, 1, 'COMMA')}円|"></dd></div>
  </dl>

  <!--
    Disclosure Triangle（開閉パネル）による詳細情報表示。
    open属性付きの1つ目は初期状態で開いた状態にしている（味わいの特徴は主要情報のため）。
  -->
  <details open>
    <summary>味わいの特徴</summary>
    <!-- sake.tagScores（タグ名→強さのMap）をth:eachでそのままキー・値のペアとして展開 -->
    <div class="tag-list">
      <span th:each="tag : ${sake.tagScores}" th:text="|${tag.key} ${tag.value}/5|"></span>
    </div>
  </details>

  <details>
    <summary>この銘柄について</summary>
    <p>掲載情報は登録された地酒データをもとに表示しています。</p>
  </details>

  <a class="button primary" th:href="@{/diagnosis}">自分に合う日本酒を診断する</a>
</main>

<footer><strong>20歳未満の飲酒は禁止されています。</strong><span>NEWBOOZE — 日本酒との新しい出会い</span></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
