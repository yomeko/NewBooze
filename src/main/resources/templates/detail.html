<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="|${sake.name} | NEWBOOZE|"></title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header class="site-header"><a class="logo" th:href="@{/}">NEW<span>BOOZE</span></a><button class="menu-toggle" aria-label="メニューを開く">☰</button><nav><a th:href="@{/search}">さがす</a><a th:href="@{/diagnosis}">好み診断</a></nav></header><main class="section page detail"><a class="back" th:href="@{/search}">← 検索結果へ戻る</a><p class="badge" th:text="${sake.type}"></p><h1 th:text="${sake.name}"></h1><p class="lead" th:text="${sake.description}"></p><dl class="spec"><div><dt>産地</dt><dd th:text="${sake.region}"></dd></div><div><dt>アルコール度数</dt><dd th:text="|${sake.abv}%|"></dd></div><div><dt>参考価格</dt><dd th:text="|${#numbers.formatInteger(sake.price, 1, 'COMMA')}円|"></dd></div></dl><details open><summary>味わいの特徴</summary><div class="tag-list"><span th:each="tag : ${sake.tagScores}" th:text="|${tag.key} ${tag.value}/5|"></span></div></details><details><summary>この銘柄について</summary><p>掲載情報はデモデータです。実データ収集後は、蔵元情報や画像などを追加して表示できます。</p></details><a class="button primary" th:href="@{/diagnosis}">自分に合う地酒を診断する</a></main><footer>NEWBOOZE — 地酒との新しい出会い</footer><script th:src="@{/js/main.js}"></script></body></html>
