<!--
  S03: 診断結果／推薦画面
  外部設計書 3.3 S03：診断結果（タグ別嗜好スコア）と、
  コサイン類似度による推薦上位N件（DiagnosisService.recommend()）を表示する。
  ※出田担当の本番デザインに置き換え予定の暫定テンプレート。
-->
<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>診断結果 | NEWBOOZE</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="site-header">
  <a class="logo" th:href="@{/}">NEW<span>BOOZE</span></a>
  <button class="menu-toggle" aria-label="メニューを開く">☰</button>
  <nav>
    <a th:href="@{/search}">日本酒をさがす</a>
    <a th:href="@{/diagnosis}">日本酒診断</a>
    <a sec:authorize="isAnonymous()" th:href="@{/login}">ログイン</a>
    <a sec:authorize="isAnonymous()" class="button" th:href="@{/signup}">新規登録</a>
    <a sec:authorize="isAuthenticated()" th:href="@{/mypage}">マイページ</a>
    <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="nav-logout-form">
      <button type="submit" class="link-button">ログアウト</button>
    </form>
  </nav>
</header>

<main class="section page">
  <p class="eyebrow">YOUR RESULT</p>
  <h1>あなたに合いそうな日本酒</h1>

  <!-- preferences（タグ名→スコアのMap）の件数を表示。#maps.size()はThymeleafのMapユーティリティ -->
  <p class="lead">選んだ回答から見つかった、今のあなたの味わい傾向です。</p>

  <!-- 診断で得られたタグ別スコアの一覧表示 -->
  <div class="tag-list preference">
    <span th:each="tag : ${preferences}" th:text="${tag.key}"></span>
  </div>

  <!--
    推薦結果一覧。DiagnosisService.Recommendation（sake, score）のリストを展開する。
    item.score（0〜1のコサイン類似度）を100倍しパーセント表示に変換している。
    formatDecimal(値, 整数部の最小桁数, 小数部の桁数) で小数点以下0桁に丸めている。
  -->
  <div class="card-grid recommendations">
    <article class="sake-card" th:each="item : ${recommendations}">
      <p class="badge">おすすめ</p>
      <h2 th:text="${item.sake.name}"></h2>
      <p class="muted" th:if="${!#strings.isEmpty(item.sake.breweryName)}" th:text="|蔵元：${item.sake.breweryName}|"></p>
      <p class="muted" th:text="|${item.sake.type} ・ ${item.sake.region}|"></p>
      <p th:text="${item.sake.description}"></p>
      <a th:href="@{/sake/{id}(id=${item.sake.id})}">詳しく見る →</a>
    </article>
  </div>

  <a class="button" th:href="@{/diagnosis}">もう一度診断する</a>
</main>

<footer><strong>20歳未満の飲酒は禁止されています。</strong><span>NEWBOOZE — 日本酒との新しい出会い</span></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
