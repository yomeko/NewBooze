<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>パスワードを忘れた方 - NEWBOOZE</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="site-header"><a class="logo" th:href="@{/}">NEW<span>BOOZE</span></a></header>
<main class="page auth-page">
    <div class="auth-card">
        <p class="eyebrow">PASSWORD HELP</p>
        <h1>パスワードを忘れた方</h1>
        <p class="auth-sub">登録済みのメールアドレスへ仮パスワードを送信します。</p>
        <p class="auth-alert" th:if="${error}" th:text="${error}"></p>
        <div th:if="${sent}">
            <p class="auth-alert success">登録されたアドレスの場合、仮パスワードを送信しました。</p>
            <a class="button primary" th:href="@{/login}">ログイン画面へ</a>
        </div>
        <form th:unless="${sent}" th:action="@{/forgot-password}" method="post">
            <div class="form-group"><label for="email">メールアドレス</label>
                <input id="email" type="email" name="email" autocomplete="email" maxlength="255" required></div>
            <button type="submit" class="button primary">仮パスワードを送信</button>
        </form>
        <div class="auth-divider"></div>
        <p class="auth-footer-link"><a th:href="@{/login}">ログイン画面に戻る</a></p>
    </div>
</main>
<footer>NEWBOOZE — 地酒との新しい出会い</footer>
</body>
</html>
