<!--
  パスワードを忘れた人が、メールアドレスを入力して仮パスワードを依頼する画面。
  送信後はPasswordResetControllerが渡すsentの値で、フォームから送信案内へ切り替える。
-->
<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="icon" type="image/png" th:href="@{/images/site-icon.png}">
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>パスワードを忘れた方 - 一升の出会い</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/site-header :: siteHeader('none')}"></header>
<main class="page auth-page">
    <div class="auth-card">
        <p class="eyebrow">PASSWORD HELP</p>
        <h1>パスワードを忘れた方</h1>
        <p class="auth-sub">登録済みのメールアドレスへ仮パスワードを送信します。</p>
        <p class="auth-alert" th:if="${error}" th:text="${error}"></p>
        <!-- 登録済みでも未登録でも同じ案内を出し、アカウントの有無が第三者にわからないようにする。 -->
        <div th:if="${sent}">
            <p class="auth-alert success">登録されたアドレスの場合、仮パスワードを送信しました。</p>
            <a class="button primary" th:href="@{/login}">ログイン画面へ</a>
        </div>
        <!-- th:unlessは条件が偽のときだけ表示する指定。まだ送信案内を出していない場合にフォームを見せる。 -->
        <form th:unless="${sent}" th:action="@{/forgot-password}" method="post">
            <div class="form-group"><label for="email">メールアドレス</label>
                <input id="email" type="email" name="email" autocomplete="email" maxlength="255" required></div>
            <button type="submit" class="button primary">仮パスワードを送信</button>
        </form>
        <div class="auth-divider"></div>
        <p class="auth-footer-link"><a th:href="@{/login}">ログイン画面に戻る</a></p>
    </div>
</main>
<footer><strong>20歳未満の飲酒は禁止されています。</strong><span>一升の出会い — 日本酒との新しい出会い</span></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
