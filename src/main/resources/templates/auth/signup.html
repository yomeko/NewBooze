<!--
  S07: 新規登録画面
  AuthController.signup()（POST /signup）へ送信する。
  th:object="${signupForm}" によりdto.SignupFormのフィールドとth:field="*{...}"を紐付け、
  バリデーションエラー時（@Validで検出）はth:errorsで各項目下にエラーメッセージを表示する。
  ※出田担当のデザインに置き換え予定の暫定テンプレート
-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新規登録 - NEWBOOZE</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <h1>新規登録</h1>

    <form th:action="@{/signup}" th:object="${signupForm}" method="post">
        <label>表示名:
            <input type="text" th:field="*{name}">
            <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color:red;"></span>
        </label>
        <label>メールアドレス:
            <input type="email" th:field="*{email}">
            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:red;"></span>
        </label>
        <label>パスワード:
            <input type="password" th:field="*{password}">
            <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color:red;"></span>
        </label>
        <button type="submit">登録する</button>
    </form>

    <p><a th:href="@{/login}">ログインはこちら</a></p>
</body>
</html>
