<!--
  アカウントの新規登録画面。フォームの入力先はAuthControllerのPOST /signup。
  th:objectでsignupFormを選び、th:fieldで各入力欄をJavaの値へ結び付け、th:errorsで入力エラーを表示する。
-->
<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
  <link rel="icon" type="image/png" th:href="@{/images/site-icon.png}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>新規登録 - 一升の出会い</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- 全画面共通ヘッダー（home.htmlと同一構成） -->
<header th:replace="~{fragments/site-header :: siteHeader('none')}"></header>

<main class="page auth-page">
    <div class="auth-card">
        <p class="eyebrow">CREATE ACCOUNT</p>
        <h1>新規登録</h1>
        <p class="auth-sub">アカウントを作成して、好み診断の結果やお気に入りを保存しましょう。</p>
        <p>メールに届いた確認リンクから、表示名とパスワードを設定します。</p>
        <p class="auth-sub">登録前に<a th:href="@{/privacy}">プライバシーポリシー</a>で登録情報の利用目的を確認できます。</p>

        <!-- novalidateでブラウザの自動チェックを省き、Javaの入力チェック結果を各入力欄の下へ表示する。 -->
        <form th:action="@{/signup}" th:object="${signupForm}" method="post" novalidate>
            <p class="field-error" role="alert" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></p>
            <div class="form-group">
                <label for="email">メールアドレス</label>
                <input id="email" type="email" th:field="*{email}" autocomplete="email" placeholder="you@example.com">
                <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>
            <button type="submit" class="button primary">確認メールを送る</button>
        </form>

        <div class="auth-divider"></div>
        <p class="auth-footer-link">認証メールが届かない方は<a th:href="@{/verify-email}">認証メールの再送</a>をお試しください。</p>
        <p class="auth-footer-link">すでにアカウントをお持ちの方は <a th:href="@{/login}">ログイン</a></p>
    </div>
</main>

<footer><strong>20歳未満の飲酒は禁止されています。</strong><span>一升の出会い — 日本酒との新しい出会い</span></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
