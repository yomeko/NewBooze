<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>パスワード再設定 - 一升の出会い</title>
  <link rel="icon" type="image/png" th:href="@{/images/site-icon.png}">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/site-header :: siteHeader('none')}"></header>
<main class="page auth-page"><div class="auth-card">
  <p class="eyebrow">PASSWORD RESET</p><h1>パスワードを再設定</h1>
  <p class="auth-alert" role="alert" th:if="${error}" th:text="${error}"></p>
  <form th:if="${canReset}" th:action="@{/reset-password}" method="post">
    <p id="password-help">新しいパスワードは8文字以上、UTF-8で72バイト以内にしてください。日本語の多くは24文字が目安です。</p>
    <div class="form-group"><label for="new-password">新しいパスワード</label>
      <input id="new-password" name="newPassword" type="password" autocomplete="new-password" minlength="8" aria-describedby="password-help" required></div>
    <div class="form-group"><label for="confirm-password">新しいパスワード（確認）</label>
      <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></div>
    <button class="button primary" type="submit">パスワードを変更する</button>
  </form>
  <p>リンクは30分間、一度だけ使えます。変更後は新しいパスワードでログインしてください。</p>
  <p><a th:href="@{/forgot-password}">再設定リンクをもう一度依頼する</a></p>
  <p><a th:href="@{/login}">ログイン画面へ戻る</a></p>
</div></main>
<footer><strong>20歳未満の飲酒は禁止されています。</strong><span>一升の出会い — 日本酒との新しい出会い</span></footer>
<script th:src="@{/js/main.js}"></script>
</body></html>
