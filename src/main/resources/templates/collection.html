<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title th:text="${title + ' | 一升の出会い'}">特集 | 一升の出会い</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/site-header :: siteHeader(${currentPage})}"></header>
<main class="page collection-page">
  <section class="collection-hero" aria-labelledby="collection-title">
    <p class="eyebrow">一升の出会い 特集</p>
    <h1 id="collection-title" th:text="${title}">特集</h1>
    <p class="lead" th:text="${description}">一升の出会いのおすすめを紹介します。</p>
    <p class="collection-status">掲載内容を準備しています。公開までしばらくお待ちください。</p>
    <a class="button primary" th:href="@{/search}">日本酒をさがす</a>
  </section>
</main>
<footer><strong>20歳未満の飲酒は禁止されています。</strong><span>一升の出会い — 日本酒との新しい出会い</span></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
