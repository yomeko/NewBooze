<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>アカウント設定 - NEWBOOZE</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<header th:replace="~{fragments/site-header :: siteHeader('mypage')}"></header>
<main class="page mypage account-settings-page">
  <nav class="page-back" aria-label="戻る"><a th:href="@{/mypage}">← マイページに戻る</a></nav>
  <div class="section-heading"><p>ACCOUNT</p><h1>アカウント設定</h1></div>
  <p class="auth-alert success" th:if="${success}" th:text="${success}"></p><p class="auth-alert" th:if="${error}" th:text="${error}"></p>
  <section class="mypage-card" id="settings">
    <div class="profile-image-settings"><div class="avatar preview"><img th:if="${hasProfileImage}" th:src="@{/mypage/profile-image}" th:style="|object-position:${profileImagePositionX}% ${profileImagePositionY}%;transform:scale(${profileImageZoom / 100.0});transform-origin:${profileImagePositionX}% ${profileImagePositionY}%|" alt="現在のプロフィール画像"><span th:unless="${hasProfileImage}" th:text="${#strings.substring(user.name,0,1)}">酒</span></div><div class="profile-image-controls"><h2>プロフィール画像</h2><p class="muted">JPEG・PNG・GIF、20MBまで（大きな画像は自動圧縮）</p><div class="image-actions"><form th:action="@{/mypage/profile-image}" method="post" enctype="multipart/form-data"><label class="button file-button">写真を選択<input type="file" name="profileImage" accept="image/jpeg,image/png,image/gif" required></label><button class="button primary">画像を変更</button></form><button th:if="${hasProfileImage}" type="button" class="button" id="open-image-editor">表示範囲を調整</button><form th:if="${hasProfileImage}" th:action="@{/mypage/profile-image/delete}" method="post"><button class="link-button danger">画像を削除</button></form></div></div></div>
    <div class="settings-grid">
      <form th:action="@{/mypage/profile}" method="post"><h2>プロフィール</h2><div class="form-group"><label for="name">表示名・ニックネーム</label><input id="name" name="name" th:value="${user.name}" maxlength="50" required></div><div class="form-group"><label for="email">メールアドレス</label><input id="email" name="email" type="email" th:value="${user.email}" required></div><button class="button">変更を保存</button></form>
      <form th:action="@{/mypage/password}" method="post"><h2>パスワード</h2><div class="form-group"><label for="currentPassword">現在のパスワード</label><input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required></div><div class="form-group"><label for="newPassword">新しいパスワード</label><input id="newPassword" name="newPassword" type="password" minlength="8" maxlength="72" autocomplete="new-password" required></div><button class="button">パスワードを変更</button></form>
    </div>
  </section>
  <section class="mypage-card danger-zone"><div><p class="eyebrow">DANGER ZONE</p><h2>アカウント削除</h2><p class="muted">お気に入りや診断結果を含むすべてのデータが削除され、元に戻せません。</p></div><form th:action="@{/mypage/account/delete}" method="post" onsubmit="return confirm('アカウントを本当に削除しますか？');"><label for="deletePassword">確認のため現在のパスワードを入力</label><input id="deletePassword" name="currentPassword" type="password" autocomplete="current-password" required><button class="button danger-button">アカウントを削除</button></form></section>
</main>
<div class="image-editor" id="image-editor" th:if="${hasProfileImage}" hidden role="dialog" aria-modal="true" aria-labelledby="image-editor-title"><div class="image-editor-panel"><header><button type="button" class="editor-close" aria-label="閉じる">×</button><h2 id="image-editor-title">プロフィール画像を編集</h2><button type="submit" form="image-position-form" class="button primary">適用</button></header><p class="editor-help">画像をドラッグして、丸い枠に表示したい位置を合わせてください</p><div class="crop-stage" id="crop-stage"><img id="profile-position-preview" th:src="@{/mypage/profile-image}" th:style="|object-position:${profileImagePositionX}% ${profileImagePositionY}%;transform:scale(${profileImageZoom / 100.0});transform-origin:${profileImagePositionX}% ${profileImagePositionY}%|" alt="位置調整中のプロフィール画像"><div class="crop-mask" aria-hidden="true"></div></div><form id="image-position-form" th:action="@{/mypage/profile-image/position}" method="post"><input id="position-x" type="hidden" name="positionX" th:value="${profileImagePositionX}"><input id="position-y" type="hidden" name="positionY" th:value="${profileImagePositionY}"><label class="zoom-control"><span aria-hidden="true">−</span><input id="image-zoom" type="range" name="zoom" min="100" max="300" step="5" th:value="${profileImageZoom}" aria-label="画像の拡大率"><span aria-hidden="true">＋</span></label><button type="button" id="reset-image-position" class="link-button">中央に戻す</button></form></div></div>
<footer><strong>20歳未満の飲酒は禁止されています。</strong><span>NEWBOOZE — 日本酒との新しい出会い</span></footer><script th:src="@{/js/main.js}"></script></body></html>
